[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name            = "webscout"
version         = "0.1.0"
description     = "A modular web application security scanner"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.8"

keywords = ["security", "pentesting", "web", "scanner", "hacking"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

# Runtime dependencies (same as requirements.txt)
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# Future phase dependencies (install when ready):
# phase2 = ["beautifulsoup4>=4.12.0", "httpx>=0.25.0"]
# phase3 = ["beautifulsoup4>=4.12.0"]

# ── CLI entry point ───────────────────────────────────────────────────────────
# After `pip install -e .` this makes `webscout` available as a shell command
[project.scripts]
webscout = "webscout.main:main"

# ── Tool configuration ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"

[tool.coverage.run]
source = ["webscout"]
omit   = ["tests/*", "setup.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false